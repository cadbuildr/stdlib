name: pytest

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create the environment
        run: uv venv --python ${{ matrix.python-version }}
      # TEMPORARY: cadbuildr-foundation 0.3.0 is not on PyPI yet. Install it
      # from the foundation repo until it is released, then drop this step
      # and let the `cadbuildr-foundation>=0.3.0,<0.4.0` pin resolve from PyPI.
      - name: Install foundation from git (temporary)
        run: uv pip install "cadbuildr-foundation @ git+https://github.com/cadbuildr/foundation@master"
      - name: Install stdlib + test deps
        run: uv pip install -e . pytest
      - name: Test with pytest
        run: uv run --no-sync pytest -q
