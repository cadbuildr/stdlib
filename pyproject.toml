[project]
name = "cadbuildr-stdlib"
version = "0.5.0"
description = "Standard library for cadbuildr with tools, parts, assemblies built on top of foundation"
requires-python = ">=3.10.0,<4.0.0"
authors = [
    {name = "Cadbuildr Team"},
]
dependencies = [
    "cadbuildr-foundation>=0.3.0,<0.4.0",
]

# Library discovery (cadbuildr.foundation.library): id = import root.
[project.entry-points."cadbuildr.libraries"]
stdlib = "cadbuildr.stdlib"

[tool.cadbuildr.dependencies]
cadbuildr-foundation = "^0.3.0"

[dependency-groups]
dev = [
    "pytest>=8",
    # check_interference(exact=True) in tests/test_exact_interference.py
    "cadbuildr-foundation[exact]",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "cadbuildr",
]

[build-system]
requires = [
    "hatchling>=1.27.0",
]
build-backend = "hatchling.build"
